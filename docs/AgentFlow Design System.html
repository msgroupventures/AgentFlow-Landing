  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"nav-meta\">Brand · v1.2 · 2026-05-17<\u002Fp>\n    <nav>\n      <ol>\n        <li><a href=\"#foundations\"><span class=\"num\">01<\u002Fspan> Foundations<\u002Fa><\u002Fli>\n        <li><a href=\"#mark\"><span class=\"num\">02<\u002Fspan> The Mark<\u002Fa><\u002Fli>\n        <li><a href=\"#lockups\"><span class=\"num\">03<\u002Fspan> Lockups<\u002Fa><\u002Fli>\n        <li><a href=\"#color\"><span class=\"num\">04<\u002Fspan> Color<\u002Fa><\u002Fli>\n        <li><a href=\"#typography\"><span class=\"num\">05<\u002Fspan> Typography<\u002Fa><\u002Fli>\n        <li><a href=\"#spacing\"><span class=\"num\">06<\u002Fspan> Spacing<\u002Fa><\u002Fli>\n        <li><a href=\"#components\"><span class=\"num\">07<\u002Fspan> Components<\u002Fa><\u002Fli>\n        <li><a href=\"#motion\"><span class=\"num\">08<\u002Fspan> Motion<\u002Fa><\u002Fli>\n        <li><a href=\"#family\"><span class=\"num\">09<\u002Fspan> Family<\u002Fa><\u002Fli>\n        <li><a href=\"#a11y\"><span class=\"num\">10<\u002Fspan> Accessibility<\u002Fa><\u002Fli>\n        <li><a href=\"#resources\"><span class=\"num\">11<\u002Fspan> Resources<\u002Fa><\u002Fli>\n      <\u002Fol>\n    <\u002Fnav>\n    <div class=\"nav-foot\">\n      <p>Single authoritative source. Supersedes v1.0 (Mar 2026) and v1.1 (May 2026).<\u002Fp>\n      <p>MS Group LLC — Buenos Aires<\u002Fp>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main>\n\n    <!-- ─────────── hero ─────────── -->\n    <header class=\"hero\">\n      <p class=\"eyebrow\">Brand Guidelines · v1.2 · Effective 2026-05-17<\u002Fp>\n      <h1>Precision technology, <em>Argentine warmth<\u002Fem>.<\u002Fh1>\n      <p class=\"lede\">\n        AgentFlow is an AI-powered operations platform built for RE/MAX agents in Argentina —\n        a quietly confident product that lives on WhatsApp and feels like the best hire your franchise ever made.\n        This document is the working reference for everything you build under the AgentFlow name.\n      <\u002Fp>\n      <div class=\"meta\">\n        <span><b>Version<\u002Fb> · 1.2<\u002Fspan>\n        <span><b>Status<\u002Fb> · Locked<\u002Fspan>\n        <span><b>Owner<\u002Fb> · MS Group LLC<\u002Fspan>\n        <span><b>Type system<\u002Fb> · Geist Sans<\u002Fspan>\n        <span><b>Primary<\u002Fb> · #00D4AA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ─────────── 01 foundations ─────────── -->\n    <section class=\"sec\" id=\"foundations\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">01 · Foundations<\u002Fp>\n        <h2>Who we are.<\u002Fh2>\n        <p class=\"dek\">\n          AgentFlow combines world-class AI engineering with the relationship-driven reality of Argentine\n          real estate. The AI agent handles the entire operational lifecycle through WhatsApp — the dominant\n          communication channel in the market. Approachable to a 45-year-old RE/MAX agent in Belgrano.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Brand personality<\u002Fh3>\n      <div class=\"personality\">\n        <div>\n          <span class=\"tag\">01 · Engineering<\u002Fspan>\n          <h4>Precision Technology<\u002Fh4>\n          <p>World-class AI engineering under the hood, built with the same craft as Linear, Vercel, or Stripe.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <span class=\"tag\">02 · Heart<\u002Fspan>\n          <h4>Argentine Warmth<\u002Fh4>\n          <p>Rooted in the human, relationship-driven reality of Argentine real estate. Speaks Spanish (es-AR, vos).<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <span class=\"tag\">03 · Posture<\u002Fspan>\n          <h4>Quietly Confident<\u002Fh4>\n          <p>Not a flashy startup. Not a corporate vendor. The best hire your franchise ever made — who happens to be an AI.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <span class=\"tag\">04 · Channel<\u002Fspan>\n          <h4>WhatsApp-Native<\u002Fh4>\n          <p>Works where agents already live. No new app to learn. The AI speaks their language and their channel.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Tone spectrum<\u002Fh3>\n      <div class=\"tone-rows\">\n        <div class=\"tone-row\">\n          <span class=\"pole\">Professional<\u002Fspan>\n          <div class=\"track\"><span class=\"dot\" style=\"left:70%\"><\u002Fspan><\u002Fdiv>\n          <span class=\"pole right\">Casual <code style=\"color:var(--dim);font-size:12px\">≈ 70%<\u002Fcode><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tone-row\">\n          <span class=\"pole\">Technical<\u002Fspan>\n          <div class=\"track\"><span class=\"dot\" style=\"left:70%\"><\u002Fspan><\u002Fdiv>\n          <span class=\"pole right\">Simple <code style=\"color:var(--dim);font-size:12px\">≈ 70%<\u002Fcode><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tone-row\">\n          <span class=\"pole\">Bold<\u002Fspan>\n          <div class=\"track\"><span class=\"dot\" style=\"left:60%\"><\u002Fspan><\u002Fdiv>\n          <span class=\"pole right\">Understated <code style=\"color:var(--dim);font-size:12px\">≈ 60%<\u002Fcode><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tone-row\">\n          <span class=\"pole\">Argentine<\u002Fspan>\n          <div class=\"track\"><span class=\"dot\" style=\"left:60%\"><\u002Fspan><\u002Fdiv>\n          <span class=\"pole right\">Global <code style=\"color:var(--dim);font-size:12px\">≈ 60%<\u002Fcode><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <blockquote class=\"pullquote\">\n        “Tu asistente de IA que automatiza las operaciones inmobiliarias a través de WhatsApp.”\n        <span class=\"who\">One-liner · ES (primary)<\u002Fspan>\n      <\u002Fblockquote>\n    <\u002Fsection>\n\n    <!-- ─────────── 02 mark ─────────── -->\n    <section class=\"sec\" id=\"mark\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">02 · The Mark<\u002Fp>\n        <h2>A wave carved into a disc.<\u002Fh2>\n        <p class=\"dek\">\n          The AgentFlow mark is a solid Electric Teal disc containing a symmetric sine wave carved as negative\n          space in Deep Navy Black. One crest, one trough, both reaching equal amplitude — the visual signature\n          of <em>flow<\u002Fem>. The wave is the only internal element.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"mark-row\">\n        <div class=\"canvas mark-construct\">\n          <span class=\"canvas-label\">Construction · 256-unit grid<\u002Fspan>\n          <svg viewBox=\"0 0 256 256\" class=\"mark-grid\" xmlns=\"http://www.w3.org/2000/svg\">\n            <!-- grid lines -->\n            <g>\n              <line x1=\"0\" y1=\"32\" x2=\"256\" y2=\"32\"><\u002Fline>\n              <line x1=\"0\" y1=\"64\" x2=\"256\" y2=\"64\"><\u002Fline>\n              <line x1=\"0\" y1=\"96\" x2=\"256\" y2=\"96\"><\u002Fline>\n              <line x1=\"0\" y1=\"160\" x2=\"256\" y2=\"160\"><\u002Fline>\n              <line x1=\"0\" y1=\"192\" x2=\"256\" y2=\"192\"><\u002Fline>\n              <line x1=\"0\" y1=\"224\" x2=\"256\" y2=\"224\"><\u002Fline>\n              <line x1=\"32\" y1=\"0\" x2=\"32\" y2=\"256\"><\u002Fline>\n              <line x1=\"64\" y1=\"0\" x2=\"64\" y2=\"256\"><\u002Fline>\n              <line x1=\"96\" y1=\"0\" x2=\"96\" y2=\"256\"><\u002Fline>\n              <line x1=\"160\" y1=\"0\" x2=\"160\" y2=\"256\"><\u002Fline>\n              <line x1=\"192\" y1=\"0\" x2=\"192\" y2=\"256\"><\u002Fline>\n              <line x1=\"224\" y1=\"0\" x2=\"224\" y2=\"256\"><\u002Fline>\n            <\u002Fg>\n            <line class=\"axis\" x1=\"0\" y1=\"128\" x2=\"256\" y2=\"128\"><\u002Fline>\n            <line class=\"axis\" x1=\"128\" y1=\"0\" x2=\"128\" y2=\"256\"><\u002Fline>\n\n            <!-- disc -->\n            <circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#00D4AA\"><\u002Fcircle>\n            <!-- ghost outline showing 18u margin -->\n            <circle class=\"outer\" cx=\"128\" cy=\"128\" r=\"124\"><\u002Fcircle>\n            <!-- wave -->\n            <path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#0A0B14\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n\n            <!-- guide dots -->\n            <circle cx=\"43\" cy=\"128\" r=\"2.5\" fill=\"#00D4AA\"><\u002Fcircle>\n            <circle cx=\"85\" cy=\"64\" r=\"2.5\" fill=\"#00D4AA\"><\u002Fcircle>\n            <circle cx=\"128\" cy=\"128\" r=\"2.5\" fill=\"#00D4AA\"><\u002Fcircle>\n            <circle cx=\"213\" cy=\"128\" r=\"2.5\" fill=\"#00D4AA\"><\u002Fcircle>\n\n            <!-- labels -->\n            <g font-family=\"Geist Mono, monospace\" font-size=\"7\" fill=\"#94A3B8\">\n              <text x=\"40\" y=\"142\">43,128<\u002Ftext>\n              <text x=\"82\" y=\"58\">85,64<\u002Ftext>\n              <text x=\"132\" y=\"142\">128,128<\u002Ftext>\n              <text x=\"180\" y=\"142\">213,128<\u002Ftext>\n            <\u002Fg>\n            <text x=\"6\" y=\"10\" font-family=\"Geist Mono, monospace\" font-size=\"6\" fill=\"#64748B\">0,0<\u002Ftext>\n            <text x=\"234\" y=\"252\" font-family=\"Geist Mono, monospace\" font-size=\"6\" fill=\"#64748B\">256,256<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div class=\"canvas mark-specs\">\n          <table class=\"specs-table\">\n            <caption>Geometry — 256-unit grid<\u002Fcaption>\n            <tbody>\n              <tr><th>Disc center<\u002Fth><td>(128, 128)<\u002Ftd><\u002Ftr>\n              <tr><th>Disc radius<\u002Fth><td>106<\u002Ftd><\u002Ftr>\n              <tr><th>Grid margin<\u002Fth><td>18 units<\u002Ftd><\u002Ftr>\n              <tr><th>Wave start<\u002Fth><td>(43, 128)<\u002Ftd><\u002Ftr>\n              <tr><th>Wave control<\u002Fth><td>(85, 64)<\u002Ftd><\u002Ftr>\n              <tr><th>Wave mid<\u002Fth><td>(128, 128)<\u002Ftd><\u002Ftr>\n              <tr><th>Wave end<\u002Fth><td>(213, 128)<\u002Ftd><\u002Ftr>\n              <tr><th>Stroke width<\u002Fth><td>18 u<\u002Ftd><\u002Ftr>\n              <tr><th>Stroke cap<\u002Fth><td>round<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Mark variants — surface-aware<\u002Fh3>\n      <div class=\"grid-2\">\n        <div class=\"variant-tile surface-navy\">\n          <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" alt=\"Primary mark on Deep Navy\">\n          <div class=\"vt-meta\">\n            <span class=\"name\">Primary<\u002Fspan>\n            <span class=\"swatch\">on Deep Navy · #0A0B14<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"variant-tile surface-warm\">\n          <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" alt=\"Primary mark on Warm Dark\">\n          <div class=\"vt-meta\">\n            <span class=\"name\">Primary<\u002Fspan>\n            <span class=\"swatch\">on Warm Dark · #111827<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"variant-tile surface-cream\">\n          <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" alt=\"Primary mark on cream\">\n          <div class=\"vt-meta\">\n            <span class=\"name\">Primary<\u002Fspan>\n            <span class=\"swatch\">on Cream · #F1F5F9<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"variant-tile surface-white\">\n          <img src=\"c4b193db-0196-4b89-b025-00864c635a7a\" alt=\"Mono dark mark on white\">\n          <div class=\"vt-meta\">\n            <span class=\"name\">Mono dark<\u002Fspan>\n            <span class=\"swatch\">on Pure White · #FFFFFF<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Clear space &amp; minimum size<\u002Fh3>\n      <div class=\"grid-2\">\n        <div class=\"canvas clearspace\">\n          <span class=\"canvas-label\">Clear space · ¼ disc diameter<\u002Fspan>\n          <div class=\"cs-stack\">\n            <div class=\"cs-guide\">\n              <span class=\"cs-label\">¼ D<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cs-mark\">\n              <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" alt=\"\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"canvas\">\n          <span class=\"canvas-label\">Minimum sizes<\u002Fspan>\n          <div class=\"size-scale\">\n            <div class=\"sz\">\n              <img src=\"4dc0a157-7abe-4c72-9875-ad824a201a3b\" width=\"16\" height=\"16\" alt=\"\">\n              <code><strong>16 px<\u002Fstrong><\u002Fcode>\n              <code>digital min<\u002Fcode>\n            <\u002Fdiv>\n            <div class=\"sz\">\n              <img src=\"4dc0a157-7abe-4c72-9875-ad824a201a3b\" width=\"32\" height=\"32\" alt=\"\">\n              <code><strong>32 px<\u002Fstrong><\u002Fcode>\n              <code>textured min<\u002Fcode>\n            <\u002Fdiv>\n            <div class=\"sz\">\n              <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" width=\"56\" height=\"56\" alt=\"\">\n              <code><strong>56 px<\u002Fstrong><\u002Fcode>\n              <code>UI standard<\u002Fcode>\n            <\u002Fdiv>\n            <div class=\"sz\">\n              <img src=\"1fa1d54a-5988-4a68-875d-a5cb7e0382cb\" width=\"96\" height=\"96\" alt=\"\">\n              <code><strong>96 px<\u002Fstrong><\u002Fcode>\n              <code>marketing<\u002Fcode>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Don't<\u002Fh3>\n      <div class=\"donts-grid\">\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#8B5CF6\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#0A0B14\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't change disc color outside the family palette.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#EF4444\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't recolor the wave. Wave is always Navy or Off-White.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><g transform=\"rotate(28 40 40)\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#0A0B14\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fg><\u002Fsvg>\n          <span class=\"caption\">Don't rotate, skew, or distort the wave or disc.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><defs><filter id=\"g\"><feGaussianBlur stdDeviation=\"2.5\"><\u002FfeGaussianBlur><\u002Ffilter><\u002Fdefs><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\" filter=\"url(#g)\" opacity=\"0.6\"><\u002Fcircle><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#0A0B14\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't add shadow, glow, gradient, or outer stroke.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><rect x=\"6\" y=\"6\" width=\"68\" height=\"68\" rx=\"8\" fill=\"none\" stroke=\"#F1F5F9\" stroke-width=\"1.5\"><\u002Frect><circle cx=\"40\" cy=\"40\" r=\"26\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 20 40 Q 30 28, 40 40 T 60 40\" stroke=\"#0A0B14\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't place the mark inside a frame or container.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"none\" stroke=\"#00D4AA\" stroke-width=\"4\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#00D4AA\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't use a hollow outline variant. The solid disc is the family signature.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 16 32 Q 28 16, 40 32 T 64 32\" stroke=\"#0A0B14\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"caption\">Don't shift the wave. Crests resolve at the vertical center.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <span class=\"x\">✕<\u002Fspan>\n          <svg viewBox=\"0 0 80 80\"><circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"#00D4AA\" opacity=\"0.25\"><\u002Fcircle><path d=\"M 16 40 Q 28 24, 40 40 T 64 40\" stroke=\"#0A0B14\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.25\"><\u002Fpath><text x=\"10\" y=\"48\" font-family=\"Geist Sans\" font-size=\"10\" fill=\"#F1F5F9\" font-weight=\"500\">heading<\u002Ftext><\u002Fsvg>\n          <span class=\"caption\">Don't use the mark as a watermark behind text.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─────────── 03 lockups ─────────── -->\n    <section class=\"sec\" id=\"lockups\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">03 · Lockups<\u002Fp>\n        <h2>Three lockups, chosen by surface.<\u002Fh2>\n        <p class=\"dek\">\n          The horizontal lockup ships in three variants. The variant is chosen by the <em>target surface<\u002Fem>,\n          not by aesthetic preference. Electric Teal on pure white fails WCAG AA — use the mono-on-light\n          variant with Teal-Dark <code>#00A98A<\u002Fcode> on the <em>Flow<\u002Fem> word.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"lockup-stack\">\n        <div class=\"lockup-row\">\n          <div class=\"lockup-display surface-navy\">\n            <img src=\"da0e6f93-1d50-4730-b690-2363d7f581d5\" alt=\"On-dark lockup\">\n          <\u002Fdiv>\n          <div class=\"card lockup-info\">\n            <span class=\"role\">Primary<\u002Fspan>\n            <h4>On dark<\u002Fh4>\n            <p>Deep Navy <code>#0A0B14<\u002Fcode> → Elevated Surface <code>#1A1F2E<\u002Fcode>. Off-White <em>agent<\u002Fem> + Electric Teal <em>Flow<\u002Fem>.<\u002Fp>\n            <code class=\"filename\">agentflow-lockup-horizontal-on-dark.svg<\u002Fcode>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"lockup-row\">\n          <div class=\"lockup-display surface-cream\">\n            <img src=\"3db9e801-18fa-4b27-929d-6460db4bc75a\" alt=\"On-light lockup\">\n          <\u002Fdiv>\n          <div class=\"card lockup-info\">\n            <span class=\"role\">Secondary<\u002Fspan>\n            <h4>On light<\u002Fh4>\n            <p>Cream <code>#F1F5F9<\u002Fcode> and warmer light tones. <strong>Not for pure white<\u002Fstrong> — fails axe / Lighthouse audits.<\u002Fp>\n            <code class=\"filename\">agentflow-lockup-horizontal-on-light.svg<\u002Fcode>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"lockup-row\">\n          <div class=\"lockup-display surface-white\">\n            <img src=\"2b652eb4-9001-44ad-874c-30bf177603bf\" alt=\"Mono-on-light lockup\">\n          <\u002Fdiv>\n          <div class=\"card lockup-info\">\n            <span class=\"role\">Accessibility<\u002Fspan>\n            <h4>Mono on light<\u002Fh4>\n            <p>Pure white, single-color print, WCAG AA-mandated contexts. Substitutes Teal-Dark <code>#00A98A<\u002Fcode> for contrast.<\u002Fp>\n            <code class=\"filename\">agentflow-lockup-horizontal-mono-on-light.svg<\u002Fcode>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Selection decision flow<\u002Fh3>\n      <div class=\"flow\">\n\n        <div class=\"flow-node q\">\n          <span class=\"step\">Step 01<\u002Fspan>\n          <span class=\"label\">Is the background dark — anywhere from <code>#0A0B14<\u002Fcode> through <code>#1A1F2E<\u002Fcode>?<\u002Fspan>\n          <div class=\"surface-range\" aria-hidden=\"true\">\n            <span class=\"swatch-dot\" style=\"background:#0A0B14\"><\u002Fspan>\n            <span class=\"swatch-dot\" style=\"background:#111827\"><\u002Fspan>\n            <span class=\"swatch-dot\" style=\"background:#1A1F2E\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"flow-branch\">\n          <div class=\"flow-arm\">\n            <span class=\"flow-answer yes\">Yes · dark surface<\u002Fspan>\n            <div class=\"flow-result terminal\">\n              <div class=\"result-head\">\n                <span class=\"result-name\"><span class=\"arrow\">→<\u002Fspan>on-dark<\u002Fspan>\n                <span class=\"result-meta\">Primary<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"surface-strip\" style=\"background:linear-gradient(90deg,#0A0B14,#111827 50%,#1A1F2E)\">\n                <span>#0A0B14 → #1A1F2E<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"flow-arm\">\n            <span class=\"flow-answer no\">No · light surface<\u002Fspan>\n            <div class=\"flow-node q\">\n              <span class=\"step\">Step 02<\u002Fspan>\n              <span class=\"label\">Is the background pure white <code>#FFFFFF<\u002Fcode> <em>or<\u002Fem> is WCAG AA mandated (axe, Lighthouse, public-sector)?<\u002Fspan>\n              <div class=\"surface-range\" aria-hidden=\"true\">\n                <span class=\"swatch-dot\" style=\"background:#FFFFFF\"><\u002Fspan>\n                <span class=\"swatch-dot line\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"flow-branch\" style=\"margin-left:calc(50% + 8px)\">\n          <div class=\"flow-arm\">\n            <span class=\"flow-answer yes\">Yes · #FFFFFF / a11y<\u002Fspan>\n            <div class=\"flow-result terminal\">\n              <div class=\"result-head\">\n                <span class=\"result-name\"><span class=\"arrow\">→<\u002Fspan>mono-on-light<\u002Fspan>\n                <span class=\"result-meta\">Accessibility<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"surface-strip light\" style=\"background:#FFFFFF\">\n                <span>#FFFFFF · pure white only<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"flow-arm\">\n            <span class=\"flow-answer no\">No · cream / warm light<\u002Fspan>\n            <div class=\"flow-result terminal\">\n              <div class=\"result-head\">\n                <span class=\"result-name\"><span class=\"arrow\">→<\u002Fspan>on-light<\u002Fspan>\n                <span class=\"result-meta\">Secondary<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"surface-strip light\" style=\"background:linear-gradient(90deg,#F1F5F9,#F5F1EA 70%,#EFE7D8)\">\n                <span>#F1F5F9 → warm light · never #FFFFFF<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Other lockups<\u002Fh3>\n      <div class=\"grid-2\">\n        <div class=\"canvas lockup-display surface-warm\" style=\"aspect-ratio: 1; padding: 48px;\">\n          <span class=\"canvas-label\">Stacked<\u002Fspan>\n          <img src=\"6a80063c-5006-47f0-a78e-066299341982\" alt=\"Stacked lockup\" style=\"max-width: 60%;\">\n        <\u002Fdiv>\n        <div class=\"canvas lockup-display surface-warm\" style=\"aspect-ratio: 1; padding: 48px;\">\n          <span class=\"canvas-label\">Wordmark only<\u002Fspan>\n          <img src=\"99835e83-214a-41c9-a136-83e0dcb4679b\" alt=\"Wordmark only\" style=\"max-width: 80%;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─────────── 04 color ─────────── -->\n    <section class=\"sec\" id=\"color\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">04 · Color<\u002Fp>\n        <h2>Midnight Operations palette.<\u002Fh2>\n        <p class=\"dek\">\n          Dark sophistication with warm, inviting accents. The Electric Teal differentiates from the overused\n          purple/blue AI gradients. Warm Amber feels human. WhatsApp Green appears only in WhatsApp UI.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"swatch-group\">\n        <div class=\"grp-title\">\n          <h3>Backgrounds<\u002Fh3>\n          <span class=\"grp-note\">3 levels of depth<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"swatch-grid\">\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#0A0B14;\"><span class=\"role\" style=\"color:#F1F5F9\">Page<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Deep Navy Black<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#0A0B14<\u002Fspan><span class=\"token\">--bg<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#111827;\"><span class=\"role\" style=\"color:#F1F5F9\">Card<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Warm Dark<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#111827<\u002Fspan><span class=\"token\">--bg-2<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#1A1F2E;\"><span class=\"role\" style=\"color:#F1F5F9\">Hover<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Elevated Surface<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#1A1F2E<\u002Fspan><span class=\"token\">--bg-3<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#1E293B;\"><span class=\"role\" style=\"color:#F1F5F9\">Edge<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Subtle Edge<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#1E293B<\u002Fspan><span class=\"token\">--edge<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"swatch-group\">\n        <div class=\"grp-title\">\n          <h3>Accents<\u002Fh3>\n          <span class=\"grp-note\">Max 10% of any viewport<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"swatch-grid\">\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#00D4AA;\"><span class=\"role\" style=\"color:#0A0B14\">Primary<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Electric Teal<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#00D4AA<\u002Fspan><span class=\"token\">--teal<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#00A98A;\"><span class=\"role\" style=\"color:#0A0B14\">A11y<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Teal-Dark<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#00A98A<\u002Fspan><span class=\"token\">--teal-dark<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#F59E0B;\"><span class=\"role\" style=\"color:#0A0B14\">Secondary<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Warm Amber<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#F59E0B<\u002Fspan><span class=\"token\">--amber<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#06B6D4;\"><span class=\"role\" style=\"color:#0A0B14\">Gradient end<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Teal Cyan<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#06B6D4<\u002Fspan><span class=\"token\">--cyan<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"swatch-group\">\n        <div class=\"grp-title\">\n          <h3>Text &amp; UI<\u002Fh3>\n          <span class=\"grp-note\">Never use pure white on dark<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"swatch-grid\">\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#F1F5F9;\"><span class=\"role\" style=\"color:#0A0B14\">Body<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Off-White<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#F1F5F9<\u002Fspan><span class=\"token\">--text<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#94A3B8;\"><span class=\"role\" style=\"color:#0A0B14\">Secondary<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Muted Silver<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#94A3B8<\u002Fspan><span class=\"token\">--mute<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#64748B;\"><span class=\"role\" style=\"color:#F1F5F9\">Caption<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Dim Gray<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#64748B<\u002Fspan><span class=\"token\">--dim<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#1E293B;\"><span class=\"role\" style=\"color:#F1F5F9\">Divider<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Subtle Edge<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#1E293B<\u002Fspan><span class=\"token\">--edge<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"swatch-group\">\n        <div class=\"grp-title\">\n          <h3>Semantic<\u002Fh3>\n          <span class=\"grp-note\">Contextual use only<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"swatch-grid\">\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#25D366;\"><span class=\"role\" style=\"color:#0A0B14\">WhatsApp<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">WhatsApp Green<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#25D366<\u002Fspan><span class=\"token\">--whatsapp<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#EF4444;\"><span class=\"role\" style=\"color:#F1F5F9\">Error<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Soft Red<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#EF4444<\u002Fspan><span class=\"token\">--red<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#F59E0B;\"><span class=\"role\" style=\"color:#0A0B14\">Warn<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Warm Amber<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#F59E0B<\u002Fspan><span class=\"token\">--amber<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"swatch\">\n            <div class=\"chip\" style=\"background:#00D4AA;\"><span class=\"role\" style=\"color:#0A0B14\">Success<\u002Fspan><\u002Fdiv>\n            <div class=\"meta\">\n              <div class=\"name\">Electric Teal<\u002Fdiv>\n              <div class=\"vals\"><span class=\"hex\">#00D4AA<\u002Fspan><span class=\"token\">--teal<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Primary gradient<\u002Fh3>\n      <div class=\"grad-strip\">\n        <span class=\"lbl\">#00D4AA · Electric Teal<\u002Fspan>\n        <span class=\"lbl r\">#06B6D4 · Teal Cyan<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin-top:14px;color:var(--mute);font-size:14px;\">\n        Used in hero section and <em>one<\u002Fem> additional section, max. Not repeated throughout the page.\n      <\u002Fp>\n\n      <h3 class=\"sub\">Contrast — WCAG AA reference<\u002Fh3>\n      <table class=\"contrast\">\n        <thead>\n          <tr><th>Sample<\u002Fth><th>Pairing<\u002Fth><th>Ratio<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#0A0B14;color:#F1F5F9\">Aa body text<\u002Fspan><\u002Ftd>\n            <td><code>#F1F5F9<\u002Fcode> on <code>#0A0B14<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">15.0 : 1 ✓<\u002Ftd>\n            <td>Body text on dark<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#0A0B14;color:#94A3B8\">Aa secondary<\u002Fspan><\u002Ftd>\n            <td><code>#94A3B8<\u002Fcode> on <code>#0A0B14<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">7.0 : 1 ✓<\u002Ftd>\n            <td>Secondary text on dark<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#0A0B14;color:#00D4AA\">Aa accent<\u002Fspan><\u002Ftd>\n            <td><code>#00D4AA<\u002Fcode> on <code>#0A0B14<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">8.1 : 1 ✓<\u002Ftd>\n            <td>Electric Teal on dark<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#0A0B14;color:#64748B\">Aa tertiary<\u002Fspan><\u002Ftd>\n            <td><code>#64748B<\u002Fcode> on <code>#0A0B14<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">4.6 : 1 ✓<\u002Ftd>\n            <td>Captions (large text only)<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#FFFFFF;color:#00D4AA\">Aa teal/white<\u002Fspan><\u002Ftd>\n            <td><code>#00D4AA<\u002Fcode> on <code>#FFFFFF<\u002Fcode><\u002Ftd>\n            <td class=\"ratio fail\">1.9 : 1 ✗<\u002Ftd>\n            <td><strong>Fails.<\u002Fstrong> Use Teal-Dark.<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#FFFFFF;color:#00A98A\">Aa teal-dark/white<\u002Fspan><\u002Ftd>\n            <td><code>#00A98A<\u002Fcode> on <code>#FFFFFF<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">3.7 : 1 ✓<\u002Ftd>\n            <td>Teal-Dark on white (large text)<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><span class=\"preview\" style=\"background:#FFFFFF;color:#0A0B14\">Aa navy/white<\u002Fspan><\u002Ftd>\n            <td><code>#0A0B14<\u002Fcode> on <code>#FFFFFF<\u002Fcode><\u002Ftd>\n            <td class=\"ratio pass\">19.5 : 1 ✓<\u002Ftd>\n            <td>Deep Navy on white<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fsection>\n\n    <!-- ─────────── 05 typography ─────────── -->\n    <section class=\"sec\" id=\"typography\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">05 · Typography<\u002Fp>\n        <h2>Geist Sans, one family.<\u002Fh2>\n        <p class=\"dek\">\n          A single-family system: 400 / 500 / 700, with Geist Mono as the code/UI pair. MIT-licensed, designed\n          by Basement Studio for Vercel. Replaces v1.0's Satoshi + General Sans.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"font-card\">\n        <div class=\"font-tile\">\n          <p class=\"big\">agent<b>Flow<\u002Fb><\u002Fp>\n          <div class=\"row\"><span>Family<\u002Fspan><b>Geist Sans<\u002Fb><\u002Fdiv>\n          <div class=\"row\"><span>Weights<\u002Fspan><b>400 · 500 · 700<\u002Fb><\u002Fdiv>\n          <div class=\"row\"><span>License<\u002Fspan><b>MIT<\u002Fb><\u002Fdiv>\n          <p class=\"alphabet\"><b>ABCDEFGHIJKLMNOPQRSTUVWXYZ<\u002Fb><br>abcdefghijklmnopqrstuvwxyz<br>0123456789 — ñ á é í ó ú ¿ ¡<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"font-tile mono\">\n          <p class=\"big\">{flow}<\u002Fp>\n          <div class=\"row\"><span>Family<\u002Fspan><b>Geist Mono<\u002Fb><\u002Fdiv>\n          <div class=\"row\"><span>Use<\u002Fspan><b>Code · UI labels · Metadata<\u002Fb><\u002Fdiv>\n          <div class=\"row\"><span>Letter-spacing<\u002Fspan><b>0.04em (labels)<\u002Fb><\u002Fdiv>\n          <p class=\"alphabet\" style=\"font-family:var(--font-mono);font-size:18px\"><b>ABCDEFGHIJKLM<\u002Fb><br>abcdefghijklm<br>0123456789 → ← ↑ ↓<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Type scale — desktop<\u002Fh3>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Hero headline<\u002Fspan>\n          64–80 px<br>weight 700<br>line 1.1\n        <\u002Fdiv>\n        <p class=\"type-sample type-hero\">Tu asistente de IA.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Section headline<\u002Fspan>\n          40–48 px<br>weight 700<br>line 1.2\n        <\u002Fdiv>\n        <p class=\"type-sample type-section\">Visitas confirmadas en minutos, no días.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Sub-headline<\u002Fspan>\n          24–28 px<br>weight 500<br>line 1.3\n        <\u002Fdiv>\n        <p class=\"type-sample type-sub\">Coordiná con vendedor, comprador y agente desde un solo WhatsApp.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Body large<\u002Fspan>\n          18–20 px<br>weight 400<br>line 1.6\n        <\u002Fdiv>\n        <p class=\"type-sample type-body-lg\">AgentFlow razona dinámicamente para programar visitas, generar documentos y dar seguimiento — sin flujos rígidos. La IA elige las herramientas que necesita en cada turno.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Body<\u002Fspan>\n          16 px<br>weight 400<br>line 1.6\n        <\u002Fdiv>\n        <p class=\"type-sample type-body\">El agente crea la visita en estado pendiente, contacta al vendedor por WhatsApp, espera la confirmación y luego procede con el comprador y el agente. Confirmaciones fuera de orden son válidas.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Caption / meta<\u002Fspan>\n          14 px<br>weight 500<br>line 1.5\n        <\u002Fdiv>\n        <p class=\"type-sample type-cap\" style=\"color:var(--mute)\">Última actividad · 14:23 · Buenos Aires<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-spec\">\n        <div class=\"type-meta\">\n          <span class=\"label\">Overline / label<\u002Fspan>\n          12–13 px<br>weight 500<br>tracking 0.08em<br>uppercase\n        <\u002Fdiv>\n        <p class=\"type-sample type-over\" style=\"color:var(--teal)\">Stage · Authorization obtained<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Fonts to avoid<\u002Fh3>\n      <p style=\"color:var(--mute);font-size:15px;max-width:64ch\">\n        <strong>Inter<\u002Fstrong> (generic SaaS default) ·\n        <strong>Space Grotesk<\u002Fstrong> (overused in AI tools) ·\n        <strong>Arial / Roboto<\u002Fstrong> (no personality) ·\n        <strong>Satoshi + General Sans<\u002Fstrong> (the v1.0 pair, replaced) ·\n        <strong>Any serif<\u002Fstrong> (doesn't match the brand).\n      <\u002Fp>\n    <\u002Fsection>\n\n    <!-- ─────────── 06 spacing ─────────── -->\n    <section class=\"sec\" id=\"spacing\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">06 · Spacing<\u002Fp>\n        <h2>8-pixel base grid.<\u002Fh2>\n        <p class=\"dek\">\n          Every spacing decision derives from 8 px. Max content width is <strong>1280 px centered<\u002Fstrong>;\n          hero backgrounds extend full width.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"spacing-rows\">\n        <div class=\"sp-row\"><span class=\"tok\">xs<\u002Fspan><span class=\"px\">4 px<\u002Fspan><span class=\"bar\" style=\"width:4px\"><\u002Fspan><span class=\"use\">Tight inline spacing<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">sm<\u002Fspan><span class=\"px\">8 px<\u002Fspan><span class=\"bar\" style=\"width:8px\"><\u002Fspan><span class=\"use\">Component internal padding<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">md<\u002Fspan><span class=\"px\">16 px<\u002Fspan><span class=\"bar\" style=\"width:16px\"><\u002Fspan><span class=\"use\">Between related elements<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">lg<\u002Fspan><span class=\"px\">24 px<\u002Fspan><span class=\"bar\" style=\"width:24px\"><\u002Fspan><span class=\"use\">Between groups<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">xl<\u002Fspan><span class=\"px\">32 px<\u002Fspan><span class=\"bar\" style=\"width:32px\"><\u002Fspan><span class=\"use\">Section internal padding<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">2xl<\u002Fspan><span class=\"px\">48 px<\u002Fspan><span class=\"bar\" style=\"width:48px\"><\u002Fspan><span class=\"use\">Section gap · mobile<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">3xl<\u002Fspan><span class=\"px\">64 px<\u002Fspan><span class=\"bar\" style=\"width:64px\"><\u002Fspan><span class=\"use\">Section gap · tablet<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">4xl<\u002Fspan><span class=\"px\">96 px<\u002Fspan><span class=\"bar\" style=\"width:96px\"><\u002Fspan><span class=\"use\">Section gap · desktop<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-row\"><span class=\"tok\">5xl<\u002Fspan><span class=\"px\">128 px<\u002Fspan><span class=\"bar\" style=\"width:128px\"><\u002Fspan><span class=\"use\">Hero section padding<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Breakpoints<\u002Fh3>\n      <table class=\"contrast\">\n        <thead>\n          <tr><th>Range<\u002Fth><th>Name<\u002Fth><th>Behavior<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td><code>&lt; 640 px<\u002Fcode><\u002Ftd><td>Mobile<\u002Ftd><td>Single column · hamburger nav · centered hero<\u002Ftd><\u002Ftr>\n          <tr><td><code>640 — 1024 px<\u002Fcode><\u002Ftd><td>Tablet<\u002Ftd><td>2-column grids · side-by-side hero<\u002Ftd><\u002Ftr>\n          <tr><td><code>1024 — 1440 px<\u002Fcode><\u002Ftd><td>Desktop<\u002Ftd><td>Full layout · all animations active<\u002Ftd><\u002Ftr>\n          <tr><td><code>&gt; 1440 px<\u002Fcode><\u002Ftd><td>Wide<\u002Ftd><td>Content max 1280 px · backgrounds full width<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fsection>\n\n    <!-- ─────────── 07 components ─────────── -->\n    <section class=\"sec\" id=\"components\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">07 · Components<\u002Fp>\n        <h2>Primitives in context.<\u002Fh2>\n        <p class=\"dek\">\n          The smallest UI elements, shown the way they appear in product. Buttons, badges, inputs, cards,\n          and the WhatsApp bubble that anchors every customer-facing interaction.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Buttons<\u002Fh3>\n      <div class=\"card\">\n        <div class=\"btn-row\">\n          <button class=\"btn btn-primary\">Crear visita<\u002Fbutton>\n          <button class=\"btn btn-primary btn-arrow\">Continuar <\u002Fbutton>\n          <button class=\"btn btn-secondary\">Ver detalle<\u002Fbutton>\n          <button class=\"btn btn-ghost\">Cancelar<\u002Fbutton>\n          <button class=\"btn btn-danger\">Eliminar<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"color:var(--dim);font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;margin:24px 0 0;\">\n          12 px vertical · 20 px horizontal · radius 6 px · weight 500\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Badges &amp; status<\u002Fh3>\n      <div class=\"card\">\n        <div class=\"btn-row\">\n          <span class=\"badge teal\"><span class=\"dot\"><\u002Fspan>Confirmada<\u002Fspan>\n          <span class=\"badg t's where customers actually meet\n        AgentFlow. Mirror WhatsApp's own visual language faithfully, including check marks and quick-reply buttons.\n      <\u002Fp>\n      <div class=\"grid-2\">\n        <div class=\"whatsapp-frame\">\n          <div class=\"wa-header\">\n            <div class=\"wa-avatar\"><img src=\"e0ab7186-1547-432c-8539-b546afa81abb\" alt=\"\"><\u002Fdiv>\n            <div class=\"who\">\n              <span class=\"name\" style=\"color:#e9edef\">AgentFlow<\u002Fspan>\n              <span class=\"status\">en línea · escribiendo…<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bubble them\">\n            ¡Hola María! Soy el asistente de Diego de RE/MAX Belgrano. Tengo una propuesta de visita para tu propiedad en Cabildo 2451 mañana a las 11:00. ¿Te queda bien?\n            <span class=\"time\">14:21<\u002Fspan>\n            <a class=\"qbtn\">✓ Sí, confirmo<\u002Fa>\n            <a class=\"qbtn\">✕ No puedo a esa hora<\u002Fa>\n          <\u002Fdiv>\n          <div class=\"bubble us\">\n            Perfecto, mañana 11:00 me viene bárbaro. Gracias!\n            <span class=\"time\">14:23 <span class=\"check\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bubble them\">\n            Genial, María. Te paso el aviso cuando confirme también el comprador y Diego. Que tengas buen día 💚\n            <span class=\"time\">14:23<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"display:flex;flex-direction:column;justify-content:center;gap:18px\">\n          <div>\n            <span class=\"badge mute\" style=\"margin-bottom:10px\">Inbound (them)<\u002Fspan>\n            <p style=\"margin:8px 0 0;color:var(--mute);font-size:14px\">\n              Background <code>#1f2c33<\u002Fcode>, top-left corner squared (4 px), all others 12 px. Text <code>#e9edef<\u002Fcode>.\n            <\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span class=\"badge green\" style=\"margin-bottom:10px\"><span class=\"dot\"><\u002Fspan>Outbound (us)<\u002Fspan>\n            <p style=\"margin:8px 0 0;color:var(--mute);font-size:14px\">\n              Background <code>#005c4b<\u002Fcode>, top-right corner squared. Double-check <code>#53bdeb<\u002Fcode>.\n            <\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span class=\"badge teal\" style=\"margin-bottom:10px\"><span class=\"dot\"><\u002Fspan>Template button<\u002Fspan>\n            <p style=\"margin:8px 0 0;color:var(--mute);font-size:14px\">\n              WhatsApp templates: max 3 reply buttons or 10 list items. Always use real WhatsApp blue\n              <code>#53bdeb<\u002Fcode>, not Electric Teal.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─────────── 08 motion ─────────── -->\n    <section class=\"sec\" id=\"motion\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">08 · Motion<\u002Fp>\n        <h2>Continuous, GPU-light, considerate.<\u002Fh2>\n        <p class=\"dek\">\n          All animations use <code>transform<\u002Fcode> and <code>opacity<\u002Fcode> only. The signature \"flow\" motion\n          connects sections like the wave in the mark. Always respect <code>prefers-reduced-motion<\u002Fcode>.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"ease-grid\">\n        <div class=\"ease-card\">\n          <svg viewBox=\"0 0 200 100\">\n            <line x1=\"0\" y1=\"90\" x2=\"200\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <path d=\"M 10 90 C 100 90, 100 10, 190 10\" stroke=\"#00D4AA\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n          <\u002Fsvg>\n          <div class=\"ec-name\">Section entrance<\u002Fdiv>\n          <div class=\"ec-curve\">cubic-bezier(0.16, 1, 0.3, 1) · 600 ms<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ease-card\">\n          <svg viewBox=\"0 0 200 100\">\n            <line x1=\"0\" y1=\"90\" x2=\"200\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <path d=\"M 10 90 C 60 90, 140 10, 190 10\" stroke=\"#00D4AA\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n          <\u002Fsvg>\n          <div class=\"ec-name\">Card hover<\u002Fdiv>\n          <div class=\"ec-curve\">ease · 200 ms · scale(1.02)<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ease-card\">\n          <svg viewBox=\"0 0 200 100\">\n            <line x1=\"0\" y1=\"90\" x2=\"200\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"90\" stroke=\"#1E293B\" stroke-width=\"1\"><\u002Fline>\n            <path d=\"M 10 90 C 90 90, 110 10, 190 10\" stroke=\"#00D4AA\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n          <\u002Fsvg>\n          <div class=\"ec-name\">Stagger child<\u002Fdiv>\n          <div class=\"ec-curve\">100 ms delay · 400 ms duration<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">Flow motion — live<\u002Fh3>\n      <div class=\"motion-demo\">\n        <div class=\"mover\"><\u002Fdiv>\n        <div class=\"copy\">\n          <strong>Flow particle<\u002Fstrong>\n          <span>The continuous flowing trail that connects sections — represents automated operations moving through the system. Pauses for <code>prefers-reduced-motion<\u002Fcode>.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─────────── 09 family ─────────── -->\n    <section class=\"sec\" id=\"family\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">09 · Family architecture<\u002Fp>\n        <h2>One archetype, many verticals.<\u002Fh2>\n        <p class=\"dek\">\n          AgentFlow is the first product under MS Group. Sibling vertical-AI products share the\n          <em>wave-in-disc<\u002Fem> archetype and the Geist Sans system. Each vertical gets a dedicated accent\n          color — never two verticals sharing.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"family-row\">\n        <div class=\"family-tile\">\n          <svg class=\"fmark\" viewBox=\"0 0 256 256\"><circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#00D4AA\"><\u002Fcircle><path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#0A0B14\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div class=\"fname\">agent<b style=\"color:#00D4AA\">Flow<\u002Fb><\u002Fdiv>\n          <div class=\"fvert\">Real estate · AR<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:#00D4AA\"><\u002Fi>#00D4AA<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"family-tile\">\n          <svg class=\"fmark\" viewBox=\"0 0 256 256\"><circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#F59E0B\"><\u002Fcircle><path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#0A0B14\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div class=\"fname\">insure<b style=\"color:#F59E0B\">Flow<\u002Fb><\u002Fdiv>\n          <div class=\"fvert\">Insurance<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:#F59E0B\"><\u002Fi>#F59E0B<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"family-tile\">\n          <svg class=\"fmark\" viewBox=\"0 0 256 256\"><circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#F87171\"><\u002Fcircle><path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#0A0B14\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div class=\"fname\">care<b style=\"color:#F87171\">Flow<\u002Fb><\u002Fdiv>\n          <div class=\"fvert\">Healthcare<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:#F87171\"><\u002Fi>#F87171<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"family-tile\">\n          <svg class=\"fmark\" viewBox=\"0 0 256 256\"><circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#06B6D4\"><\u002Fcircle><path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#0A0B14\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div class=\"fname\">cash<b style=\"color:#06B6D4\">Flow<\u002Fb><\u002Fdiv>\n          <div class=\"fvert\">Finance<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:#06B6D4\"><\u002Fi>#06B6D4<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"family-row\" style=\"margin-top:16px\">\n        <div class=\"family-tile reserved\">\n          <div class=\"fmark\"><\u002Fdiv>\n          <div class=\"fname\" style=\"color:var(--mute)\">[ legal ]<\u002Fdiv>\n          <div class=\"fvert\">Reserved · TBD<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:var(--edge)\"><\u002Fi>To choose<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"family-tile reserved\">\n          <div class=\"fmark\"><\u002Fdiv>\n          <div class=\"fname\" style=\"color:var(--mute)\">[ logistics ]<\u002Fdiv>\n          <div class=\"fvert\">Reserved · TBD<\u002Fdiv>\n          <div class=\"fhex\"><i style=\"background:var(--edge)\"><\u002Fi>To choose<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"family-tile reserved\" style=\"grid-column: span 2; text-align:left; padding:24px 28px\">\n          <div style=\"display:flex;align-items:flex-start;gap:18px\">\n            <svg class=\"fmark\" style=\"width:56px;height:56px;flex-shrink:0;margin:0\" viewBox=\"0 0 256 256\"><circle cx=\"128\" cy=\"128\" r=\"106\" fill=\"#1E293B\"><\u002Fcircle><path d=\"M 43 128 Q 85 64, 128 128 T 213 128\" stroke=\"#64748B\" stroke-width=\"18\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <div class=\"fname\" style=\"text-align:left\">Family rule<\u002Fdiv>\n              <p style=\"color:var(--mute);font-size:13.5px;margin:6px 0 0;line-height:1.55\">\n                New verticals must choose a color at least <strong>45°<\u002Fstrong> away on the hue wheel from any\n                reserved color, and achieve <strong>8:1+<\u002Fstrong> contrast on Deep Navy.\n              <\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\">What transfers at acquisition<\u002Fh3>\n      <div class=\"grid-2\">\n        <div class=\"card\">\n          <span class=\"badge teal\" style=\"margin-bottom:10px\"><span class=\"dot\"><\u002Fspan>Acquirer receives<\u002Fspan>\n          <p style=\"color:var(--mute);font-size:14.5px;margin:8px 0 0;line-height:1.6\">\n            The vertical-specific mark · the vertical-specific wordmark · the brand name (e.g. \"AgentFlow\") ·\n            the domain (e.g. <code>agentflow.casa<\u002Fcode>) · all marketing collateral specific to that vertical.\n          <\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"badge amber\" style=\"margin-bottom:10px\"><span class=\"dot\"><\u002Fspan>MS Group retains<\u002Fspan>\n          <p style=\"color:var(--mute);font-size:14.5px;margin:8px 0 0;line-height:1.6\">\n            The wave archetype as design language · family extension rights for all other verticals · the parent\n            brand identity · the right to launch new verticals using the archetype with new colors.\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─────────── 10 a11y ─────────── -->\n    <section class=\"sec\" id=\"a11y\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">10 · Accessibility<\u002Fp>\n        <h2>WCAG AA — non-negotiable.<\u002Fh2>\n        <p class=\"dek\">\n          All body text ≥ 4.5:1. Large text and UI elements ≥ 3:1. Motion respects user preferences.\n          Focus states are visible. Headings are logical.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <ul class=\"checklist\">\n        <li>All interactive elements keyboard accessible<\u002Fli>\n        <li><code>prefers-reduced-motion<\u002Fcode> respected on every animation<\u002Fli>\n        <li>Semantic HTML — <code>&lt;nav&gt;<\u002Fcode>, <code>&lt;main&gt;<\u002Fcode>, <code>&lt;section&gt;<\u002Fcode>, <code>&lt;footer&gt;<\u002Fcode><\u002Fli>\n        <li><code>aria-label<\u002Fcode> on icon-only buttons<\u002Fli>\n        <li>Focus visible: 2 px solid teal, 2 px offset<\u002Fli>\n        <li>Heading levels logical · <code>h1<\u002Fcode> hero, <code>h2<\u002Fcode> sections<\u002Fli>\n        <li><code>font-display: swap<\u002Fcode> on all webfonts<\u002Fli>\n        <li>Pure-white surfaces use mono-on-light with Teal-Dark <code>#00A98A<\u002Fcode><\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <!-- ─────────── 11 resources ─────────── -->\n    <section class=\"sec\" id=\"resources\">\n      <div class=\"sec-head\">\n        <p class=\"sec-num\">11 · Resources<\u002Fp>\n        <h2>Asset library.<\u002Fh2>\n        <p class=\"dek\">All marks and lockups ship as SVG. Click any tile to open the source file.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"resource-grid\">\n        <a class=\"resource\" href=\"brand/agentflow-mark.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">M<\u002Fspan>\n          <span><span class=\"lbl\">Primary mark<\u002Fspan><span class=\"sub\">agentflow-mark.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-mark-mono-dark.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">M<\u002Fspan>\n          <span><span class=\"lbl\">Mono dark mark<\u002Fspan><span class=\"sub\">agentflow-mark-mono-dark.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-favicon.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">M<\u002Fspan>\n          <span><span class=\"lbl\">Favicon (16/32)<\u002Fspan><span class=\"sub\">agentflow-favicon.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-lockup-horizontal-on-dark.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">L<\u002Fspan>\n          <span><span class=\"lbl\">Lockup · on dark<\u002Fspan><span class=\"sub\">…-on-dark.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-lockup-horizontal-on-light.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">L<\u002Fspan>\n          <span><span class=\"lbl\">Lockup · on light<\u002Fspan><span class=\"sub\">…-on-light.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-lockup-horizontal-mono-on-light.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">L<\u002Fspan>\n          <span><span class=\"lbl\">Lockup · mono on light<\u002Fspan><span class=\"sub\">…-mono-on-light.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-lockup-stacked.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">L<\u002Fspan>\n          <span><span class=\"lbl\">Lockup · stacked<\u002Fspan><span class=\"sub\">…-stacked.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-wordmark.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">W<\u002Fspan>\n          <span><span class=\"lbl\">Wordmark only<\u002Fspan><span class=\"sub\">agentflow-wordmark.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-whatsapp-avatar.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">A<\u002Fspan>\n          <span><span class=\"lbl\">WhatsApp avatar<\u002Fspan><span class=\"sub\">…-whatsapp-avatar.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-og-image.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">O<\u002Fspan>\n          <span><span class=\"lbl\">OG image<\u002Fspan><span class=\"sub\">agentflow-og-image.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"brand/agentflow-lockup-horizontal-bw-inpi.svg\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">T<\u002Fspan>\n          <span><span class=\"lbl\">B&amp;W trademark · INPI<\u002Fspan><span class=\"sub\">…-bw-inpi.svg<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a class=\"resource\" href=\"uploads/BRAND-GUIDELINES-v1.2-ac9acb6c.md\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"icon\">📄<\u002Fspan>\n          <span><span class=\"lbl\">Brand Guidelines · v1.2<\u002Fspan><span class=\"sub\">.md source<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer class=\"foot\">\n      <div>\n        <p style=\"margin:0\">AgentFlow · MS Group LLC<\u002Fp>\n        <p style=\"margin:6px 0 0;color:var(--dim)\">Brand v1.2 · 2026-05-17<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">\n        <p style=\"margin:0;color:var(--mute)\">Geist Sans · MIT-licensed<\u002Fp>\n        <p style=\"margin:6px 0 0\">an MS Group company<\u002Fp>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n  // Scroll-spy for sidebar nav\n  (function(){\n    const links = Array.from(document.querySelectorAll('nav ol a'));\n    const map = new Map();\n    links.forEach(a => {\n      const id = a.getAttribute('href').slice(1);\n      const sec = document.getElementById(id);\n      if (sec) map.set(sec, a);\n    });\n\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(en => {\n        const a = map.get(en.target);\n        if (!a) return;\n        if (en.isIntersecting && en.intersectionRatio > 0.25) {\n          links.forEach(x => x.classList.remove('is-active'));\n          a.classList.add('is-active');\n        }\n      });\n    }, { rootMargin: \"-30% 0px -55% 0px\", threshold: [0, 0.25, 0.5] });\n\n    map.forEach((_, sec) => io.observe(sec));\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
