<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <title>AgentFlow horizontal lockup (monochrome on light)</title>
  <desc>High-contrast variant: monochrome dark mark with Teal-Dark Flow. For pure-white surfaces, single-color print, accessibility-mandated contexts. WCAG AA-large compliant. Geist Sans.</desc>
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/index.css');
      .agentflow-wm { font-family: 'Geist Sans', 'Geist', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  
  <g transform="translate(20, 20)">
    <circle cx="40" cy="40" r="34" fill="#0A0B14"/>
    <path d="M 13 40 Q 26 20, 40 40 T 67 40" stroke="#F1F5F9" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <text x="120" y="76" class="agentflow-wm" font-size="54">
    <tspan font-weight="400" fill="#0A0B14">agent</tspan><tspan font-weight="700" fill="#00A98A">Flow</tspan>
  </text>
</svg>
